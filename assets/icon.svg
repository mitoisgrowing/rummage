<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3d8bff"/>
      <stop offset=".55" stop-color="#5e5ce6"/>
      <stop offset="1" stop-color="#b44fe8"/>
    </linearGradient>
    <linearGradient id="gloss" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity=".28"/>
      <stop offset=".5" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="7" flood-color="#1a0b4d" flood-opacity=".45"/>
    </filter>
    <clipPath id="lens"><circle cx="112" cy="112" r="47"/></clipPath>
  </defs>
  <!-- rounded tile -->
  <rect x="12" y="12" width="232" height="232" rx="56" fill="url(#bg)"/>
  <rect x="12" y="12" width="232" height="232" rx="56" fill="url(#gloss)"/>
  <rect x="12.75" y="12.75" width="230.5" height="230.5" rx="55.25" fill="none" stroke="#fff" stroke-opacity=".18" stroke-width="1.5"/>
  <!-- a magnifier looking into a waveform: digging through sounds -->
  <g filter="url(#sh)" transform="translate(3.5 3.5)">
    <line x1="163" y1="163" x2="192" y2="192" stroke="#fff" stroke-width="26" stroke-linecap="round"/>
    <circle cx="112" cy="112" r="58" fill="#fff" fill-opacity=".14" stroke="#fff" stroke-width="20"/>
    <g fill="#fff" clip-path="url(#lens)">
      <rect x="77" y="104" width="10" height="16" rx="5"/>
      <rect x="93" y="90" width="10" height="44" rx="5"/>
      <rect x="109" y="78" width="10" height="68" rx="5"/>
      <rect x="125" y="94" width="10" height="36" rx="5"/>
      <rect x="141" y="102" width="10" height="20" rx="5"/>
    </g>
  </g>
</svg>
